# Rules of the Telegram → MQTT gateway.
#
# chats.<name>: the chat's public username; it is also the MQTT topic level
#   (air_threat/source/telegram/<name>/message, .../event).
# poll_interval: seconds between history requests, 3 by default.
# rules: Python regular expressions, matched against the message text after
#   emoji are removed and spaces are collapsed. Every match gives one event of
#   the rule's kind; named groups become the event's fields.
# watch: words that a message about the chat's subject is likely to contain.
#   Not used while listening; the `review` command lists the messages that
#   contain them and matched no rule, which is how a new wording is noticed.
# max_length: a longer message (after cleaning) gives no events. Alerts are
#   short; daily summaries and commentary use the same words and are long.
#
# The wordings drift. Re-validate once a month: see "Monthly review" in README.md.

chats:
  # Official Air Force channel. Wordings checked on 30 days of history, 2026-11-12.
  kpszsu:
    poll_interval: 3
    max_length: 200
    watch: '(?i)баліст|ракет|відбій|загроза (?!застосування авіаційних)|бандерол|реактив'
    rules:
      - kind: ballistic_clear
        pattern: 'Відбій загрози застосування\s+балістичного'
      - kind: ballistic_threat
        pattern: '[Зз]агроза (?:застосування )?балістичного озброєння(?:\s+зі?\s+(?P<from>[^.!\n(]+))?'
      # Follow-ups that say where a missile is flying. Some follow-ups are only a
      # place name ("Київ!"): no rule can know them, follow reply_to instead.
      # "Балістика на Київ", "Балістичні ракети курсом на Київ", "4 балістичні
      # ракети на Київ!". Only the forms used in alerts: the daily summaries say
      # "атакував балістичними ракетами".
      - kind: ballistic_missile
        pattern: '(?i)балісти(?:ка|чн(?:а|і|их)\s+ракет[аи]?)\s+(?P<route>[^.!\n]+)'
      # "Ще на Київ балістика"
      - kind: ballistic_missile
        pattern: '(?i)(?P<route>на\s+[^.!\n]+?)\s+балістика'
      # "Повторний пуск балістики на Київ", "Ще пуск балістики"
      - kind: ballistic_missile
        pattern: '(?i)пуск\w*\s+балістики(?:\s+(?P<route>[^.!\n]+))?'
      # A "fast target" is what the channel calls a ballistic missile it cannot
      # name yet: "Швидкісна ціль на Чернігівщині у напрямку Києва", "Ще швидкісна
      # ціль на Київ з півночі" (2026-11-17, before any "Балістика на Київ"). Only
      # when Kyiv or Kyivshchyna is named: the other 25 fast targets of 30 days
      # flew at the front oblasts and Odesa and are not known to be ballistic.
      - kind: ballistic_missile
        pattern: '(?i)швидкісн\w+(?:\s+ціль)?\s+(?P<route>(?:на|в|у|над)\s+[^.!\n]*?ки[єїі]в[^.!\n]*)'
      - kind: cruise_missile
        pattern: '(?i)крилат(?:а|і|их)\s+ракет[аи]?\s+(?P<route>[^.!\n]+)'
      # Cruise missiles in the short forms the channel uses: "КР на Хмельниччину
      # (Шепетівка)", "Тернопільщина: КР на Збараж", "Групи ракет повз Шаргород
      # (Вінниччина)", "Х-101 …". The whole line is the match, so a region in front
      # counts as a place (the same as for the Banderol).
      - kind: cruise_missile
        pattern: '(?im)^(?![^\n]*(?:обходять|потенційн|повз\s+ки[єїі]в))[^\n]*(?:(?<!\w)кр(?!\w)|(?<!\w)х-?101|групи?\s+ракет)[^\n]*'
      # The warning hours ahead: bombers have launched. 2026-11-20 04:51, official,
      # 2 h before the first missiles over the Kyiv region. Not "У разі здійснення
      # пусків …, входження очікується близько 06:30": that is the follow-up with
      # the expected time, a reply to this message.
      - kind: cruise_launch
        pattern: '(?im)^[^\n]*здійснено\s+пуски\s+крилатих\s+ракет[^\n]*'
      # A missile of an unnamed type: "Ракета на КИїв!", "Ще ракети на Київ",
      # "Ще 2 ракети на Київ!"
      - kind: missile
        pattern: '(?im)^(?:ще\s+)?(?:\d+\s+)?ракет[аи]\s+(?P<route>[^.!\n]+)'
      # Threats known only by their course. The whole line is the match, so a
      # region in front counts as a place ("Київщина: Бандероль курсом на
      # Кагарлик"). "Бандероль", "ББ «Бандероль»", "Баражуючі боєприпаси
      # «Бандероль»", "S8000 Бандероль/Дань-Т" (the last only in long summaries).
      - kind: banderol
        pattern: '(?im)^[^\n]*(?:бандерол|s-?8000)[^\n]*'
      # "Реактивний БпЛА курсом на Київ з півночі.", "Реактивні БпЛА ...",
      # "Реактивний курсом на Рівне".
      - kind: jet_drone
        pattern: '(?im)^[^\n]*реактивн(?:ий|і|их)(?!\w)[^\n]*'
      # At night the channel writes a jet drone over the city without the word:
      # "БпЛА на Оболоні", "БпЛА в р-ні Шулявки у напрямку Мінського масиву"
      # (2026-11-14, 2026-11-20; each followed a jet-drone message within 10
      # minutes). Only the owner's districts, Obolon and the Minskyi massif, and
      # only a line that starts with "БпЛА": "Ударні БпЛА" are ordinary drones.
      - kind: jet_drone
        pattern: '(?im)^БпЛА(?!\w)[^\n]*(?:оболон|мінськ(?:ий|ого|ому|им)\s+масив)[^\n]*'

  # Unofficial Kyiv monitoring channel: informal lower-case wording, almost
  # everything in it concerns Kyiv and its suburbs. Wordings checked on 30 days
  # of history, 2026-11-12. Most patterns are tied to the start of a line: the
  # channel also posts long commentary that mentions the same words.
  kyiv_m0nitoring:
    poll_interval: 3
    max_length: 120
    watch: '(?i)баліст|ракет|спуск|загроз|циркон|іскандер|онікс|відбій|чисто|фікс|бандерол|реактив'
    rules:
      # "Загроза балістики з Брянська.", "Загроза з Воронежа.", "знову загроза
      # балістики", "Повторно дали загрозу балістики."
      # Not when the same message takes it back: "повторна загроза балістики /
      # все ж відбій, помилка" (2026-11-17).
      - kind: ballistic_threat
        pattern: '(?im)(?!(?s:.*)помилк)^(?:знову\s+|повторн\w+\s+(?:дали\s+)?)?загроз[ау]\s+(?:балістики(?:\s+зі?\s+(?P<from>[\w''-]+))?|зі?\s+(?P<from2>[\w''-]+))'
      # The threat in one or two words: "балістика", "бал", "Балістика Воронеж."
      - kind: ballistic_threat
        pattern: '(?im)^(?:бал|бал+[іи]стика)(?:\s+(?P<from>воронеж\w*|брянс\w*|курс\w*))?[.!]*$'
      # A launch reported as it happens, 1-3 minutes before "на Київ": "вихід з
      # брянська", "Знову вихід з Курська", "Повторні виходи балістики"
      # (2026-11-20). Not the hedged ones: "Знову вихід з Брянска можливий",
      # "Можливо ще вихід ракет!" (they were guesses; the same night's "ще
      # ракети!!" has no launch place and is left out too).
      - kind: ballistic_threat
        pattern: '(?im)^(?![^\n]*можлив)(?:знову\s+|повторн\w+\s+)?вих[іо]д\s+зі?\s+(?P<from>брянс\w+|курс\w+|воронеж\w*|міллеров\w*)[.!\s]*$'
      - kind: ballistic_threat
        pattern: '(?im)^повторні\s+виходи\s+балістики[.!\s]*$'
      # Cruise missiles (the same as in kpszsu, with this channel's wording):
      # "х-101 на вишгородський район", "група кр на бровари", "крилаті з півночі
      # по морю". Not "поки що крилаті обходять київ" (2026-11-20: a message that
      # they miss Kyiv), nor "потенційну загрозу Х-101" (a guess an hour ahead).
      - kind: cruise_missile
        pattern: '(?im)^(?![^\n]*(?:обходять|потенційн|повз\s+ки[єїі]в))[^\n]*(?:крилат\w+|(?<!\w)кр(?!\w)|(?<!\w)х-?101|калібр\w*)[^\n]*'
      # Bombers launched: "відбулись пуски з тушок", "літаки ту-95/160 запустили
      # понад 30 ракет". Not the Kalibr launches from the sea: they fly west.
      - kind: cruise_launch
        pattern: '(?im)^(?:відбул\w+\s+пуски\s+(?:з\s+тушок|х-?101)|літаки\s+ту-?95[^\n]*запустили)[^\n]*'
      # Only the launch area, as the whole message: "брянск", "Воронеж". With more
      # lines it is a relayed Russian alert ("Брянск / Ракетная опасность").
      - kind: ballistic_threat
        pattern: '(?i)\A(?P<from>воронеж|брянсь?к|курсь?к)[.!]*\Z'
      # "Балістика на Київ/передмістя." (the channel's fixed phrase), "2 ракети
      # на київ", "2 ракети з брянська на київ", "2-4 циркона на Київ."
      - kind: ballistic_missile
        pattern: '(?i)(?:балісти\w+|ракет\w*|циркон\w*|іскандер\w*|онікс\w*)(?:\s+[^.!:\n]*?)?\s+на\s+(?P<route>(?:[^.!:\n«]*?[\s/])?ки[єїі]в(?!ськ)[^.!\n]*)'
      # "Летить швидкісна повз Чернігівщину на Київ" (2026-11-20 02:32, 70 s before
      # the official channel): a fast target with no word "ціль", at Kyiv.
      - kind: ballistic_missile
        pattern: '(?i)швидкісн\w+(?:\s+[^.!:\n]*?)?\s+на\s+(?P<route>(?:[^.!:\n«]*?[\s/])?ки[єїі]в(?!ськ)[^.!\n]*)'
      # "Ще ціль над Києвом/передмістям" (2026-11-20 02:38, after a descent): a
      # target of an unnamed type. As with "ракета", it counts only during a
      # ballistic threat: the channel calls drones "ціль" too.
      - kind: missile
        pattern: '(?im)^(?:ще\s+)?ціль\s+(?P<route>над\s+[^.!\n]*ки[єїі]в(?!ськ)[^.!\n]*)'
      # More missiles, with no destination: "2 ракети!", "Ще 2-4 ракети!", "4 ракети"
      - kind: ballistic_missile
        pattern: '(?im)^(?:ще\s+)?(?P<count>\d+(?:-\d+)?)\s+ракет\w*[\s!]*$'
      # A follow-up that names only places, Kyiv among them: "БЦ і Київ ❗️",
      # "Трипілля, БЦ, Київ ❗️" (2026-11-19 23:59 and 00:00 UTC, during a threat
      # to Kyiv). Біла Церква (БЦ) is not "at us"; Kyiv in the line is. Not a
      # reply, so no reply_to can follow it.
      - kind: ballistic_missile
        pattern: '(?im)^(?=[^\n]*ки[єїі]в(?!ськ))(?P<route>(?:(?:бц|трипілля|біла церква|київ|передмістя|бровари|бориспіл)(?:\s*[,/]\s*|\s+(?:і|та)\s+|\s+)?)+)[.!]*\s*$'
      # The missile is in its terminal phase: impact within seconds. Only this
      # channel reports it. "спуску" (as in a joke about stairs) must not match.
      - kind: ballistic_descent
        pattern: '(?i)(?<!\w)спуск(?!\w)(?:\s+на\s+(?P<where>[^.!\n]+))?'
      # The channel's own end of the ballistic threat, usually minutes before
      # the official one. A bare "відбій" is not here: it may be about drones.
      - kind: ballistic_clear
        pattern: '(?i)відбій\s+(?:по\s+)?(?:балісти\w+|загрози)|балістичн\w+\s+(?:загроза\s+знята|відбій)|(?:загрозу(?:\s+по\s+ракетам)?|ракетну)\s+зняли'
      # Nothing is being tracked, or the previous warning is withdrawn: "чисто",
      # "не фіксується", "Без загроз.", "Ні.", "ні, поспішили". Also said about
      # drones, so it means something only during a ballistic threat.
      - kind: nothing_tracked
        pattern: '(?im)^все\s+ж\s+відбій,?\s+помилк\w*[.!]*$'
      - kind: nothing_tracked
        pattern: '(?im)^(?:чисто(?:\s+по\s+ракетам)?|не\s+фікс\w*(?:\s+ракет[^.\n]*)?|без\s+(?:загроз|фіксацій\s+ракет)|ні(?:,\s*(?:поспішили|київ\s+обходить[^.\n]*))?|все\s+ж\s+таки\s+не\s+балістика)[.!]*$'
      # "Бандероль на Бровари/Київ.", "бандероль біля вишгорода, увага"
      - kind: banderol
        pattern: '(?im)^[^\n]*бандерол[^\n]*'
      # "реактив на вишгород підстанцію", "реактиви по морю в бік вишгорода/києва",
      # "3 реактива на київ". Not a report of the past: "під києвом був реактив,
      # не фікс вже", "реактив збили".
      - kind: jet_drone
        pattern: '(?im)^(?![^\n]*(?:(?<!\w)був(?!\w)|не\s+фікс\w*\s+вже|збил|збит|мінус))[^\n]*(?<!\w)реактив(?:и|а|ний|ні)?(?!\w)[^\n]*'

  # Private channel of one person, a countrywide monitor. Recorded only (it is
  # not under situation.sources): its threat and all-clear repeat kpszsu about
  # 20 s later, and its author was silent from 2026-11-10 to 2026-11-19. What is
  # its own: the per-missile "спуск" count, Zircon/Onyx courses, launches
  # ("Вихід Брянськ"). Wordings checked on 30 days of history, 2026-11-19.
  war_monitor:
    poll_interval: 3
    max_length: 250
    watch: '(?i)баліст|ракет|спуск|циркон|онікс|іскандер|відбій'
    rules:
      # "Загроза балістики з Брянська. Увага." The follow-ups "Загроза балістики
      # триває" and "…з Брянська та Курська триває." are not new threats.
      - kind: ballistic_threat
        pattern: '(?m)^Загроза балістики\s+зі?\s+(?P<from>[^.!\n]+?)\.\s*Увага'
      - kind: ballistic_clear
        pattern: '(?i)відбій\s+загрози\s+балістики'
      # "Київ — спуск балістики! Друга", "Покров / Зеленодольськ— спуск балістики!",
      # "Обухів Українка  спуск балістики!"
      - kind: ballistic_descent
        pattern: '(?im)^(?P<where>[^\n]*?)\s*(?:[—–-]\s*)?спуск\s+балістики'
      # "Вихід Брянськ", "Повторний вихід Брянськ", "Виходи Курськ", "Вихід Циркону Курськ"
      - kind: launch
        pattern: '(?im)^\W*(?:(?:ще|повторн\w+|\w+ий)\s+)?вих[іо]д[и]?(?!\w)(?!\s+бортів)[^\n]*'
      - kind: hypersonic_missile
        pattern: '(?im)^[^\n]*(?:циркон|онікс)[^\n]*'

  # Kyiv ballistic channel of the team behind kyiv_m0nitoring. Recorded only:
  # its "Балістика на Київ/передмістя." is the phrase kyiv_m0nitoring repeats a
  # few seconds earlier (25 times in 30 days, none without a copy). Its own are
  # the warnings hours ahead ("48 годин США балістика", "24 години ГУР",
  # "активність балістичних установок ми очікуємо після ~01:30"): 6 of the 7
  # before 2026-11-17 were followed by a ballistic attack on Kyiv that night or
  # the next. Wordings checked on 30 days of history, 2026-11-19.
  rocketskyiv:
    poll_interval: 3
    max_length: 200
    watch: '(?i)баліст|ракет|США|ГУР|розвідк'
    rules:
      - kind: ballistic_threat
        pattern: '(?m)^Загроза балістики\s+зі?\s+(?P<from>[^.!\n]+)'
      - kind: ballistic_missile
        pattern: '(?im)^(?:ще\s+)?(?:(?:\d+(?:-\d+)?\s+)?(?:ракет|циркон)\w*|балістика)\s+на\s+(?P<route>[^.!\n]+)'
      - kind: strike_warning
        pattern: '(?i)(?P<hours>\d+)\s*(?:год\w*\s+)?(?:отримали\s+від\s+)?(?P<source>США|ГУР)'
      - kind: strike_warning
        pattern: '(?i)ГУР\s+попереджає|очікуємо\s+після\s*~?(?P<after>\d{1,2}:\d{2})'

# What the events mean for the home.
#
# home: places that mean "at us": the city, its suburbs and districts.
#   "Київського водосховища", "Київської області" are not the city, nor are
#   "Подільськ", "Кам'янець-Подільський" the district Поділ.
# region: places near enough to pay attention.
# sources.<chat>.official: its all-clear ends the threat.
# sources.<chat>.about_home: the chat writes about the home area only, so its
#   missile messages concern the home even without a place ("2 ракети!").
# Durations in seconds: episode_timeout (a threat with no all-clear ends, 3600),
#   inbound_hold ("take cover" lasts this long after the last missile message
#   toward the home, 600), descent_hold (120), repeat_interval (60).
#
# DRAFT of 2026-11-12: the list of places is not yet approved by the owner.
situation:
  home: '(?i)ки[єїі]в(?!щин|ськ)|столиц|передміст|бровар|бориспіл|вишгород|ірп[іе]н|\bбуч[аіу]\b|вишнев|дарниц|троєщин|оболон|позняк|осокорк|печерськ|\bпод(?:іл|ол(?:і|ом|у))\b|шулявк|нивк|святошин|борщаг|жулян|солом.янк|виноградар|теремк|голосі|(?:лів|прав)\w+\s+бер(?:ег|ез)\w*|(?:лів|прав)обереж\w*|\bна\s+(?:лівий|правий)\b|мінськ(?:ий|ого|ому|им)(?!\w)'
  region: '(?i)київщин|київськ\w+\s+(?:област|водосховищ)|біл\w+\s+церкв|васильк|обух|фаст[іо]в|трип[іо]л|наливайківк|макар[іо]в|українк'
  sources:
    kpszsu:
      official: true
    kyiv_m0nitoring:
      about_home: true
  # Threats known only by their course, by the event kind of their rules; the
  # kind is also the topic (air_threat/<kind>). Only messages that name a place
  # of home or region count. Durations in seconds: episode_timeout (the episode
  # ends this long after the last such message, 1800), inbound_hold (600),
  # repeat_interval (300; a reply follows the same weapon and never repeats).
  # home: narrower places that mean "at us" for this threat; the general home
  #   then counts as the region.
  # cruise_missile: a mass attack is rare (the owner, 2026-11-20): 84 missiles on
  #   2026-11-20, 79 shot down. They fly for hours and mostly west, past Kyiv, so an
  #   episode holds 30 min (not 10) after the last message and ends 45 min after it.
  # cruise_launch: bombers launched, a warning about 2 h ahead. Every message counts
  #   (always_home, they name no place); one announcement per attack: the warning holds
  #   3 h, so a second launch report in the same attack does not raise it again.
  courses:
    cruise_missile:
      inbound_hold: 1800
      episode_timeout: 2700
    cruise_launch:
      always_home: true
      inbound_hold: 10800
      episode_timeout: 10800
      repeat_interval: 21600
    banderol:
    # Jet drones head for Kyiv or a suburb about 16 times a day (32 days to
    # 2026-11-13): only a drone over the city itself is "at us". The channel
    # puts the city first ("Київ: реактивний БпЛА …", "Київ Реактивний БпЛА
    # над містом!"; other cities write "Дніпро … над містом"), or "над Києвом".
    # Obolon and the Minskyi massif (the owner's districts, 2026-11-20) count
    # without it ("Реактивний БпЛА на Мінський масив"): 13 more episodes in 32
    # days, one a day more in the last week. Vyshhorod counts only when the drone
    # flies at it or through it toward the city ("на Вишгород з півночі", "курсом
    # на Вишгород/Київ", "через Вишгород у напрямку центру"): from the north it
    # keeps going south, over or near the owner's home (2026-11-20). Not "біля
    # Вишгорода", not "з Києва через Вишгород на Димер" (away from the city).
    jet_drone:
      home: '(?im)^\W*київ(?!\w)|над\s+(?:києвом|столицею)|в\s+межах\s+києва|оболон|мінськ(?:ий|ого|ому|им)|(?:на|[ув]\s+напрямку|в\s+бік|в\s+район)\s+вишгород|(?:через|повз)\s+вишгород\w*\s+(?:[ув]\s+напрямку\s+|на\s+)?(?:центр\w*|ки[єїі]в\w*|оболон\w*)'
