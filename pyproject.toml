[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-mqtt-gateway"
description = "Listens to Telegram chats with a user session and publishes messages and rule matches to MQTT"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "telegram_mqtt_gateway.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
