[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "air-threat-monitor"
description = "Follows air threats to a home in Ukraine from Telegram channels and publishes messages, rule matches and decisions to MQTT"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.14.5",
    "paho-mqtt==2.2.0",
    "PyYAML==6.0.3",
    "qrcode==8.2",
    "Telethon==1.45.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "air_threat_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
